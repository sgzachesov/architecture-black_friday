name: mongo-sharding-repl

services:
  mongos:
    image: dh-mirror.gitverse.ru/mongo:latest
    command: mongos --configdb configSrvReplSet/configSrv-1:27019,configSrv-2:27019,configSrv-3:27019 --port 27017 --bind_ip_all
    restart: on-failure
    depends_on:
      - configSrv-1
      - configSrv-2
      - configSrv-3
      - shard1-1
      - shard1-2
      - shard1-3
      - shard2-1
      - shard2-2
      - shard2-3

  configSrv-1:
    image: dh-mirror.gitverse.ru/mongo:latest
    command: mongod --configsvr --replSet configSrvReplSet --port 27019
    volumes:
      - configsrv1_data:/data/db

  configSrv-2:
    image: dh-mirror.gitverse.ru/mongo:latest
    command: mongod --configsvr --replSet configSrvReplSet --port 27019
    volumes:
      - configsrv2_data:/data/db

  configSrv-3:
    image: dh-mirror.gitverse.ru/mongo:latest
    command: mongod --configsvr --replSet configSrvReplSet --port 27019
    volumes:
      - configsrv3_data:/data/db

  shard1-1:
    image: dh-mirror.gitverse.ru/mongo:latest
    command: mongod --shardsvr --replSet shard1ReplSet --port 27018
    volumes:
      - shard11_data:/data/db

  shard1-2:
    image: dh-mirror.gitverse.ru/mongo:latest
    command: mongod --shardsvr --replSet shard1ReplSet --port 27018
    volumes:
      - shard12_data:/data/db

  shard1-3:
    image: dh-mirror.gitverse.ru/mongo:latest
    command: mongod --shardsvr --replSet shard1ReplSet --port 27018
    volumes:
      - shard13_data:/data/db

  shard2-1:
    image: dh-mirror.gitverse.ru/mongo:latest
    command: mongod --shardsvr --replSet shard2ReplSet --port 27018
    volumes:
      - shard21_data:/data/db

  shard2-2:
    image: dh-mirror.gitverse.ru/mongo:latest
    command: mongod --shardsvr --replSet shard2ReplSet --port 27018
    volumes:
      - shard22_data:/data/db

  shard2-3:
    image: dh-mirror.gitverse.ru/mongo:latest
    command: mongod --shardsvr --replSet shard2ReplSet --port 27018
    volumes:
      - shard23_data:/data/db

  pymongo_api:
    build:
      context: api_app
      dockerfile: Dockerfile
    depends_on:
      - mongos
    ports:
      - 8080:8080
    environment:
      MONGODB_URL: "mongodb://mongos:27017"
      MONGODB_DATABASE_NAME: "somedb"

volumes:
  configsrv1_data:
  configsrv2_data:
  configsrv3_data:
  shard11_data:
  shard12_data:
  shard13_data:
  shard21_data:
  shard22_data:
  shard23_data: